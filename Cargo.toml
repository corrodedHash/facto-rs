[package]
name = "facto"
version = "0.3.1"
edition = "2018"
description = "Integer factorization and prime certification"
keywords = [ "factorization", "prime", "uint" ]
categories = [ "mathematics", "science", "cryptography" ]
repository = "https://github.com/corrodedHash/facto-rs/"
license = "MIT OR Apache-2.0"
authors = [ "Lukas Wölfer <lukas.woelfer@rwth-aachen.de>" ]

[dependencies]
num-integer = "0.1.46"
num-traits = "0.2.19"
redc = "0.1.0"
rug = { version = "1.27.0", features = ["integer", "num-traits", "std"], default-features = false }
twoword = "0.1.0"

[dev-dependencies]
criterion = "0.4.0"
rug = { version = "1.27.0", features = ["integer", "num-traits", "std", "rand"], default-features = false }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

[[bench]]
name = "macro"
harness = false
path = "benches/macro/mod.rs"

[[bench]]
name = "micro"
harness = false
path = "benches/micro/mod.rs"
